<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>To-Do</title>
<style>
  :root{
    --bg:        #EEF3EC;
    --surface:   #FFFFFF;
    --border:    #DCE6D8;
    --text:      #1E2C22;
    --text-dim:  #7A8B7C;
    --green:     #3F7D4F;
    --green-light: #E4EFE2;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
    color: var(--text);
  }

  body{
    width: 360px;
    max-height: 560px;
    overflow-y: auto;
    padding: 18px 16px;
  }

  ::-webkit-scrollbar{ width: 8px; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 8px; }

  .app{
    width:100%;
  }

  h1{
    font-size: 1.25rem;
    font-weight: 700;
    margin: 0 0 16px;
    color: var(--green);
  }

  .add-row{
    display:flex;
    flex-wrap: wrap;
    gap:8px;
    margin-bottom: 16px;
  }

  .add-row input[type="text"]{
    min-width: 140px;
  }

  .add-row input{
    flex:1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--text);
  }

  .add-row input:focus{
    outline: none;
    border-color: var(--green);
  }

  .add-row input[type="date"]{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 8px;
    font-family: inherit;
    font-size: 0.8rem;
    color: var(--text);
    max-width: 128px;
  }

  .add-row input[type="date"]:focus{
    outline: none;
    border-color: var(--green);
  }

  .add-row button{
    background: var(--green);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 16px;
    font-family: inherit;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
  }

  .add-row button:hover{ opacity: 0.9; }

  .due{
    font-size: 0.75rem;
    color: var(--text-dim);
    white-space: nowrap;
    background: none;
    border: none;
    font-family: inherit;
    cursor: pointer;
    padding: 3px 6px;
    border-radius: 6px;
  }

  .due:hover{
    background: var(--green-light);
    color: var(--green);
  }

  .due.overdue{
    color: #C0392B;
    font-weight: 600;
  }

  .due-edit{
    background: var(--surface);
    border: 1px solid var(--green);
    border-radius: 6px;
    padding: 4px 6px;
    font-family: inherit;
    font-size: 0.75rem;
    color: var(--text);
  }

  .due-edit:focus{ outline: none; }

  .filters{
    display:flex;
    gap: 14px;
    margin-bottom: 12px;
  }

  .filters button{
    background:none;
    border:none;
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--text-dim);
    cursor:pointer;
    padding: 2px 0;
  }

  .filters button.active{
    color: var(--green);
    font-weight: 600;
  }

  .count{
    margin-left:auto;
    color: var(--text-dim) !important;
    font-weight: 400 !important;
    cursor:default !important;
  }

  .list{
    display:flex;
    flex-direction:column;
    gap: 8px;
  }

  .item{
    display:flex;
    flex-direction: column;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }

  .item-main{
    display:flex;
    align-items:center;
    gap: 10px;
  }

  .notes{
    margin: 0 0 0 30px;
    padding-left: 16px;
    display:flex;
    flex-direction: column;
    gap: 4px;
  }

  .notes li{
    font-size: 0.8rem;
    line-height: 1.4;
    color: var(--text-dim);
  }

  .item.done .notes li{
    text-decoration: line-through;
  }

  .notes-toggle{
    margin-left: 30px;
    align-self: flex-start;
    background:none;
    border:none;
    font-family: inherit;
    font-size: 0.74rem;
    font-weight: 500;
    color: var(--green);
    cursor:pointer;
    padding: 0;
    opacity: 0.75;
  }
  .notes-toggle:hover{ opacity: 1; }

  .notes-input{
    margin-left: 30px;
    width: calc(100% - 30px);
    background: var(--green-light);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 0.8rem;
    color: var(--text);
    resize: vertical;
    min-height: 54px;
  }
  .notes-input:focus{
    outline: none;
    border-color: var(--green);
  }

  .notes-hint{
    margin-left: 30px;
    font-size: 0.68rem;
    color: var(--text-dim);
  }

  .checkbox{
    flex-shrink:0;
    width: 18px;
    height: 18px;
    border-radius: 6px;
    border: 2px solid var(--green);
    background: transparent;
    cursor:pointer;
    position:relative;
  }
  .checkbox.checked{
    background: var(--green);
  }
  .checkbox.checked::after{
    content:'';
    position:absolute;
    left:4px; top:1px;
    width:4px; height:8px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }

  .text{
    flex:1;
    font-size: 0.88rem;
    line-height: 1.4;
    word-break: break-word;
  }

  .item.done .text{
    color: var(--text-dim);
    text-decoration: line-through;
  }

  .remove{
    flex-shrink:0;
    background:none;
    border:none;
    font-size: 0.9rem;
    color: var(--text-dim);
    cursor:pointer;
    opacity: 0;
    transition: opacity 0.1s ease;
  }
  .item:hover .remove{ opacity: 1; }
  .remove:hover{ color: #C0392B; }

  .empty{
    text-align:center;
    padding: 32px 16px;
    color: var(--text-dim);
    font-size: 0.85rem;
  }

  footer{
    margin-top: 20px;
    text-align:center;
    font-size: 0.7rem;
    color: var(--text-dim);
  }
</style>
</head>
<body>

<div class="app">
  <h1>To-Do</h1>

  <form class="add-row" id="addForm">
    <input type="text" id="taskInput" placeholder="Add a task…" autocomplete="off" autofocus />
    <input type="date" id="dueInput" aria-label="Due date" />
    <button type="submit">Add</button>
  </form>

  <div class="filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="active">Active</button>
    <button data-filter="done">Done</button>
    <span class="count" id="countLabel"></span>
  </div>

  <div class="list" id="list"></div>

  <footer>saved locally in this browser</footer>
</div>

<script src="popup.js"></script>
</body>
</html>
